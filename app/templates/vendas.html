<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDV - Vendas</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI', sans-serif;
}

body{
    background:#f3f4f6;
}

/* LAYOUT PRINCIPAL */
.container{
    display:flex;
    min-height:100vh;
}

/* SIDEBAR */
.sidebar{
    width:240px;
    background:#111827;
    color:#fff;
    display:flex;
    flex-direction:column;
}

.logo{
    padding:20px;
    font-weight:bold;
    border-bottom:1px solid rgba(255,255,255,.08);
}

.menu{
    padding:15px;
}

.menu a{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px;
    margin-bottom:6px;
    text-decoration:none;
    color:#d1d5db;
    border-radius:8px;
}

.menu a:hover{
    background:#1f2937;
}

.menu a.active{
    background:#ef4444;
    color:#fff;
}

.logout{
    margin-top:auto;
    padding:20px;
}

/* MAIN */
.main{
    flex:1;
    padding:20px;
}

/* TOPO */
.top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.title h1{
    font-size:26px;
}

.title p{
    color:#6b7280;
    font-size:14px;
}

/* CONTENT */
.content{
    display:grid;
    grid-template-columns:1fr 400px;
    gap:20px;
    align-items:stretch;
}

/* PRODUTOS */
.products-box{
    background:#fff;
    border-radius:14px;
    padding:20px;
    display:flex;
    flex-direction:column;
}

.filters{
    display:flex;
    gap:10px;
    margin-bottom:15px;
}

.filters input,
.filters select{
    padding:10px;
    border:1px solid #e5e7eb;
    border-radius:10px;
}

.filters input{
    flex:1;
    background:#f9fafb;
}

.products{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
}

.card{
    background:#fff;
    border:1px solid #f0f0f0;
    border-radius:16px;
    padding:15px;
    text-align:center;
    transition:.2s;
}

.card:hover{
    transform:translateY(-3px);
    box-shadow:0 10px 20px rgba(0,0,0,.08);
}

.card img{
    width:90px;
    height:90px;
    object-fit:contain;
}

.card h4{
    font-size:14px;
    margin-top:8px;
}

.card p{
    color:#ef4444;
    font-weight:bold;
    margin-top:5px;
}

.card button{
    margin-top:10px;
    width:38px;
    height:38px;
    border:none;
    border-radius:10px;
    background:#22c55e;
    color:#fff;
    font-size:18px;
    cursor:pointer;
}

/* CARRINHO */
.cart{
    background:#fff;
    border-radius:14px;
    display:flex;
    flex-direction:column;
    height:100%;
    min-height:760px;
    box-shadow:0 5px 15px rgba(0,0,0,.05);
}

/* HEADER CARRINHO */
.cart-header{
    display:flex;
    justify-content:space-between;
    padding:20px;
    border-bottom:1px solid #eee;
}

.clear{
    color:#ef4444;
    cursor:pointer;
    font-size:13px;
}

/* ITENS */
.cart-items{
    padding:20px;
    flex:1;
    overflow:auto;
}

.item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px 0;
    border-bottom:1px solid #f3f4f6;
}

.item h4{
    font-size:14px;
}

.item p{
    color:#ef4444;
    font-weight:600;
    font-size:13px;
}

.qty{
    display:flex;
    align-items:center;
    gap:8px;
}

.qty button{
    width:26px;
    height:26px;
    border:none;
    border-radius:6px;
    background:#f3f4f6;
    cursor:pointer;
}

/* BOTTOM */
.cart-bottom{
    padding:20px;
    border-top:1px solid #eee;
}

.summary div{
    display:flex;
    justify-content:space-between;
    margin-bottom:8px;
}

.total{
    font-size:22px;
    font-weight:bold;
    color:#16a34a;
}

.customer input{
    width:100%;
    padding:10px;
    margin-top:10px;
    border:1px solid #ddd;
    border-radius:8px;
}

/* PAGAMENTO */
.payment{
    margin-top:15px;
}

.payment-options{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-top:8px;
}

.payment-options label{
    border:1px solid #ddd;
    padding:8px;
    border-radius:8px;
    font-size:13px;
}

/* FINALIZAR */
.finish{
    width:100%;
    margin-top:15px;
    padding:14px;
    border:none;
    border-radius:10px;
    background:#16a34a;
    color:#fff;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
}

.finish:hover{
    background:#15803d;
}

</style>
</head>

<body>

<div class="container">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div class="logo">
            🛒 PDV SYSTEM
        </div>

        <div class="menu">
            <a href="#"><i class="fa-solid fa-chart-line"></i> Dashboard</a>
            <a class="active"><i class="fa-solid fa-cash-register"></i> Vendas</a>
            <a href="#"><i class="fa-solid fa-box"></i> Produtos</a>
            <a href="#"><i class="fa-solid fa-warehouse"></i> Estoque</a>
            <a href="#"><i class="fa-solid fa-rotate"></i> Relatórios</a>
        </div>

        <div class="logout">
            <i class="fa-solid fa-right-from-bracket"></i> Sair
        </div>

    </aside>

    <!-- MAIN -->
    <main class="main">

        <div class="top">
            <div class="title">
                <h1>Vendas</h1>
                <p>Selecione produtos e finalize a venda</p>
            </div>
        </div>

        <div class="content">

            <!-- PRODUTOS -->
            <section class="products-box">

                <div class="filters">
                    <input type="text" placeholder="Buscar produto...">
                    <select>
                        <option>Todas categorias</option>
                    </select>
                </div>

                <div class="products">

                    <div class="card">
                        <img src="https://cdn-icons-png.flaticon.com/512/892/892458.png">
                        <h4>Camiseta Azul</h4>
                        <p>R$ 49,90</p>
                        <button>+</button>
                    </div>

                    <div class="card">
                        <img src="https://cdn-icons-png.flaticon.com/512/2553/2553691.png">
                        <h4>Tênis Branco</h4>
                        <p>R$ 199,90</p>
                        <button>+</button>
                    </div>

                    <div class="card">
                        <img src="https://cdn-icons-png.flaticon.com/512/892/892444.png">
                        <h4>Calça Jeans</h4>
                        <p>R$ 89,90</p>
                        <button>+</button>
                    </div>

                </div>

            </section>

            <!-- CARRINHO -->
            <aside class="cart">

                <div class="cart-header">
                    <h3>Carrinho</h3>
                    <span class="clear">Limpar</span>
                </div>

                <div class="cart-items">

                    <div class="item">
                        <div>
                            <h4>Camiseta Azul</h4>
                            <p>R$ 49,90</p>
                        </div>

                        <div class="qty">
                            <button>-</button>
                            <span>1</span>
                            <button>+</button>
                        </div>
                    </div>

                </div>

                <div class="cart-bottom">

                    <div class="summary">
                        <div><span>Subtotal</span><span>R$ 49,90</span></div>
                        <div><span>Desconto</span><span>R$ 0,00</span></div>
                        <div class="total"><span>Total</span><span>R$ 49,90</span></div>
                    </div>

                    <div class="customer">
                        <input type="text" placeholder="Cliente...">
                    </div>

                    <div class="payment">
                        <div class="payment-options">
                            <label><input type="radio"> PIX</label>
                            <label><input type="radio"> Dinheiro</label>
                            <label><input type="radio"> Crédito</label>
                            <label><input type="radio"> Débito</label>
                        </div>
                    </div>

                    <button class="finish">Finalizar Venda</button>

                </div>

            </aside>

        </div>

    </main>

</div>

</body>
</html>
