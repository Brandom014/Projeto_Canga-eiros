<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Estoque</title>

    <link rel="stylesheet" href="/static/css/estoque.css">
</head>

<body>

<div class="main-content">

    <h1 class="title">Estoque</h1>

    <!-- STATS -->
    <div class="stats-grid">

        <div class="stat-card">
            <div class="stat-title">Produtos</div>
            <div class="stat-value">{{ total }}</div>
        </div>

        <div class="stat-card">
            <div class="stat-title">Em falta</div>
            <div class="stat-value">{{ em_falta }}</div>
        </div>

    </div>

    <!-- FORM -->
    <div class="table-card form-box">

        <form action="/estoque/criar" method="POST" class="form-grid">

            <input type="text" name="nome" placeholder="Nome do produto" required>
            <input type="number" step="0.01" name="preco" placeholder="Preço" required>
            <input type="number" name="estoque" placeholder="Estoque" required>

            <button type="submit" class="btn-add">Adicionar</button>

        </form>

    </div>

    <!-- TABELA -->
    <div class="table-card">

        <table>

            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Preço</th>
                    <th>Estoque</th>
                    <th>Status</th>
                    <th>Ações</th>
                </tr>
            </thead>

            <tbody>

                {% for p in produtos %}
                <tr>

                    <td>{{ p.nome }}</td>
                    <td>R$ {{ "%.2f"|format(p.preco) }}</td>
                    <td>{{ p.estoque }}</td>

                    <td>
                        {% if p.ativo %}
                            <span class="dot green"></span> Ativo
                        {% else %}
                            <span class="dot red"></span> Inativo
                        {% endif %}
                    </td>

                    <td>

                        <div class="actions">

                            <form action="/estoque/toggle/{{ p.id }}" method="POST">
                                <button class="btn-toggle">Ativar/Desativar</button>
                            </form>

                            <form action="/estoque/atualizar/{{ p.id }}" method="POST">
                                <input type="number" name="estoque" placeholder="Qtd" required>
                                <button class="btn-update">Atualizar</button>
                            </form>

                        </div>

                    </td>

                </tr>
                {% endfor %}

            </tbody>

        </table>

    </div>

</div>

</body>
</html>
