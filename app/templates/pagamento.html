<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDV - Pagamento</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- CSS de Pagamento -->
    <link rel="stylesheet" href="/static/css/pagamento.css">
</head>
<body>

    <div class="checkout-container">
        
        <!-- CABEÇALHO SUPERIOR -->
        <header class="checkout-header">
            <div>
                <h1>Finalizar Pagamento</h1>
                <p>Confira os itens e selecione a forma de pagamento.</p>
            </div>
            <a href="/vendas" class="btn-voltar">
                <i class="fa-solid fa-arrow-left"></i> Voltar às Vendas
            </a>
        </header>

        <!-- GRID PRINCIPAL -->
        <div class="checkout-grid">

            <!-- COLUNA ESQUERDA: RESUMO DO PEDIDO -->
            <div class="card-box resumo-box">
                <div class="card-header">
                    <h2><i class="fa-solid fa-receipt"></i> Resumo do pedido</h2>
                    <span class="badge-count" id="badgeCount">0 itens</span>
                </div>

                <!-- Lista de Produtos (Injetados via JavaScript) -->
                <div class="lista-produtos" id="listaProdutos">
                    <!-- Conteúdo dinâmico -->
                </div>

                <!-- Rodapé do Resumo -->
                <div class="resumo-footer">
                    <div class="linha-valor">
                        <span>Subtotal</span>
                        <strong id="subtotalValor">R$ 0,00</strong>
                    </div>

                    <div class="linha-valor desconto" id="linhaDesconto" style="display: none;">
                        <span>Desconto</span>
                        <strong id="descontoValor">- R$ 0,00</strong>
                    </div>
                    
                    <button type="button" class="btn-add-desconto" id="btnDesconto">
                        <i class="fa-solid fa-tag"></i> + Adicionar desconto
                    </button>

                    <div class="linha-valor total">
                        <span>Total a Pagar</span>
                        <span class="total-valor" id="totalValor">R$ 0,00</span>
                    </div>
                </div>
            </div>

            <!-- COLUNA DIREITA: FORMAS DE PAGAMENTO -->
            <div class="card-box pagamento-box">
                <div class="card-header">
                    <h2><i class="fa-regular fa-credit-card"></i> Forma de Pagamento</h2>
                </div>

                <!-- Opções de Forma de Pagamento -->
                <div class="grid-metodos">
                    <label class="metodo-card active">
                        <input type="radio" name="forma_pagamento" value="dinheiro" checked hidden>
                        <i class="fa-solid fa-money-bill-wave"></i>
                        <span>Dinheiro</span>
                    </label>

                    <label class="metodo-card">
                        <input type="radio" name="forma_pagamento" value="credito" hidden>
                        <i class="fa-solid fa-credit-card"></i>
                        <span>Crédito</span>
                    </label>

                    <label class="metodo-card">
                        <input type="radio" name="forma_pagamento" value="debito" hidden>
                        <i class="fa-regular fa-credit-card"></i>
                        <span>Débito</span>
                    </label>

                    <label class="metodo-card">
                        <input type="radio" name="forma_pagamento" value="pix" hidden>
                        <i class="fa-brands fa-pix"></i>
                        <span>PIX</span>
                    </label>
                </div>

                <!-- PAINEL DINÂMICO PARA DINHEIRO -->
                <div class="painel-dinheiro" id="painelDinheiro">
                    <h3><i class="fa-solid fa-calculator"></i> Cálculo de Troco</h3>
                    
                    <div class="grid-troco">
                        <div class="campo-input">
                            <label for="valorRecebido">Valor recebido (R$)</label>
                            <div class="input-prefix">
                                <span>R$</span>
                                <input type="number" id="valorRecebido" placeholder="0,00" step="0.01" min="0" autofocus>
                            </div>
                        </div>

                        <div class="box-troco">
                            <span>Troco</span>
                            <strong class="valor-troco" id="valorTroco">R$ 0,00</strong>
                        </div>
                    </div>
                </div>

                <!-- BOTÃO DE CONFIRMAÇÃO -->
                <div class="pagamento-footer">
                    <button type="button" class="btn-confirmar" id="btnConfirmar">
                        <i class="fa-solid fa-check-circle"></i> Confirmar Pagamento (F5)
                    </button>
                </div>

            </div>

        </div>

    </div>

    <!-- JS de Pagamento -->
    <script src="/static/js/pagamento.js"></script>
</body>
</html>
